name: Release APK

# Builds the signed release APK on every push to main and publishes it as the latest
# GitHub Release, always under the same file name, so this URL stays valid:
#   https://github.com/<owner>/<repo>/releases/latest/download/toolkit-tv.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches gradle/gradle-daemon-jvm.properties.
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Without the keystore this still builds (debug-signed) to check the code compiles,
      # but nothing is published: a throwaway key would block updates on the TV.
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Stop if the signing secrets are missing
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Build OK, but no release published: add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (see README), then re-run this workflow."
          exit 1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.$VERSION_CODE"
          apk="$RUNNER_TEMP/toolkit-tv.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "Toolkit $tag" \
              --notes "Build #$VERSION_CODE of ${GITHUB_SHA::7}. Install: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/toolkit-tv.apk" \
              --latest
          fi
